<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>책의 온도 - 독서 평가 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { .no-print { display: none !important; } .exam-page { page-break-after: always; } }
        .exam-page { font-family: 'Malgun Gothic', sans-serif; line-height: 1.8; color: #111; max-width: 800px; margin: 0 auto; padding: 40px; }
        .exam-header { border-bottom: 3px solid #000; padding-bottom: 20px; margin-bottom: 30px; }
        .exam-title { font-size: 24px; font-weight: 900; color: #c2410c; text-align: center; margin-bottom: 15px; }
        .exam-info { display: flex; justify-content: space-between; font-weight: bold; background: #f9f9f9; padding: 12px; border: 1px solid #ddd; }
        .question-block { margin-top: 30px; margin-bottom: 30px; }
        .option-item { display: block; margin: 8px 0 8px 25px; }
        .answer-box { margin-top: 15px; border: 1px solid #999; padding: 15px; min-height: 100px; background: #fdfdfd; }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div id="ui" class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-lg no-print">
        <h1 class="text-xl font-bold mb-4">시험지 생성 도구</h1>
        <div class="grid grid-cols-3 gap-3 mb-4">
            <input id="grade" placeholder="학년" class="border p-2 rounded">
            <input id="bookTitle" placeholder="책 제목" class="border p-2 rounded">
            <input id="authorName" placeholder="작가" class="border p-2 rounded">
        </div>
        <button onclick="generate()" class="w-full bg-black text-white py-3 rounded font-bold">시험지 만들기</button>
    </div>

    <div id="output" class="hidden">
        <div id="quiz-page" class="exam-page bg-white shadow-lg my-6"></div>
        <div id="answer-page" class="exam-page bg-white shadow-lg my-6"></div>
        <div class="fixed bottom-5 right-5 no-print"><button onclick="window.print()" class="bg-orange-600 text-white px-6 py-3 rounded-full font-bold shadow-xl">전체 인쇄하기</button></div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6IIifBfy5NyxOxhyXXCFk2pi9fY7nqljNu03sB2pqVVHg";
        
        async function generate() {
            const data = { grade: document.getElementById('grade').value, book: document.getElementById('bookTitle').value, author: document.getElementById('authorName').value };
            document.getElementById('ui').innerHTML = "<p class='text-center font-bold'>전문가 페르소나가 문항을 출제 중입니다...</p>";
            
            // 완벽하게 포함된 프롬프트
            const prompt = `
# 역할
당신은 20년 경력의 초·중등 국어 독서교육 전문가이자 교육부 권장도서 독서활동 평가문항 출제위원이다.
사용자는 [책 제목], [작가 이름], [학년]을 입력한다. 당신은 실제 책 내용을 기반으로 독서 이해 문제를 만든다.

# 가장 중요한 규칙
- 책 내용을 정확히 알고 있는 경우에만 문제를 출제한다.
- 내용을 정확히 확인할 수 없는 경우에는 절대로 추측하여 문제를 만들지 않는다.
- 대신 아래와 같이 답변한다:
  "이 책의 내용을 정확하게 확인할 수 없습니다.
  책 표지와 목차 또는 본문 일부를 업로드해 주시면 실제 내용을 기반으로 문제를 제작하겠습니다."
- 인사말이나 서두 멘트는 절대 출력하지 말고 곧바로 시험지 내용만 출력할 것.

# 학년별 난이도 및 출제 초점
- 초1~2: 등장인물, 장소, 사건, 순서
- 초3~4: 중심 내용, 인물의 마음, 사건의 원인과 결과, 중요한 사실
- 초5~6: 주제, 교훈, 인물의 변화, 추론
- 중학생: 주제, 인물의 가치관, 갈등, 추론, 비판적 사고

# 문제 구성 (총 5문항)
1. 객관식 3문항
- 형식: 항상 5지선다형 (가, 나, 다, 라, 마)
- 객관식 규칙: 정답은 하나, 오답도 그럴듯하게, 지엽적인 숫자 배제, 핵심 내용 위주.
2. 서술형 2문항
- 학생용 발문과 함께 교사/학부모를 위한 '모범 답안' 및 '채점 기준' 제공.

# 출력 양식
- 마크다운을 활용하되, 가독성 좋게 출력할 것.
- 결과물을 [문제지] 와 [정답지] 섹션으로 명확히 구분할 것.
- [문제지] 섹션 맨 위에 반드시 학생 작성란 포함:
---
**[독서 활동 평가지]**
- **학년/반**: [ ]학년 [ ]반 | **번호**: [ ]번 | **이름**: [ ]
---

입력 데이터: 학년:${data.grade}, 책:${data.book}, 작가:${data.author}`;

            const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key="+API_KEY, {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({contents: [{role: "user", parts: [{text: prompt}]}]})
            });
            const json = await res.json();
            const text = json.candidates[0].content.parts[0].text;
            const [q, a] = text.split("[정답지]");
            
            document.getElementById('quiz-page').innerHTML = `<div class="exam-header"><div class="exam-title">🔥 책의 온도 독서 평가지</div><div class="exam-info"><div>도서명: ${data.book} (${data.grade})</div><div>이름: ___________</div></div></div>` + parse(q);
            document.getElementById('answer-page').innerHTML = `<div class="exam-header"><div class="exam-title">🔑 교사용 정답 및 해설</div></div>` + parse(a);
            document.getElementById('output').classList.remove('hidden');
        }

        function parse(t) {
            return t.replace(/\[문제지\]/g, '').trim()
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/(\n\s*[1-5]\.\s+|\n\s*\[?[0-9]+번\]?)/g, '<div class="question-block"><strong style="font-size:1.1rem;">$1</strong>')
                .replace(/([가-마]\.\s*|[①②③④⑤]\s*)/g, '<span class="option-item">$1</span>')
                .replace(/\[답안 작성란\]/g, '<div class="answer-box"></div>');
        }
    </script>
</body>
</html>
