<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책의 온도 - 읽은 만큼 성장합니다.</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            header, footer, button, input, .no-print {
                display: none !important;
            }
            body {
                background-color: white !important;
                color: black !important;
                font-size: 11pt !important;
            }
            .print-area {
                display: block !important;
                visibility: visible !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4 sm:p-6">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 sm:p-8 my-4">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-orange-600 mb-2">🔥 책의 온도 - 읽은 만큼 성장합니다.</h1>
            <p class="text-sm text-slate-500">초·중등 독서교육 전문가 맞춤형 퀴즈 출제 프로그램 (Gemini 3.5 Flash)</p>
        </div>

        <!-- Input Form -->
        <div id="form-section" class="space-y-4 bg-slate-50 p-4 sm:p-6 rounded-xl border border-slate-200">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Google API Key</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">학년</label>
                    <input type="text" id="grade" value="중학교 2학년" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">책 제목</label>
                    <input type="text" id="bookTitle" placeholder="예: 어린왕자" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">작가 이름</label>
                    <input type="text" id="authorName" placeholder="예: 생텍쥐페리" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none">
                </div>
            </div>
            <button onclick="generateQuiz()" id="submitBtn" class="w-full mt-2 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md cursor-pointer">
                전문가 퀴즈 생성하기
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-orange-500 border-t-transparent"></div>
            <p class="mt-4 text-slate-600 font-medium">전문가 페르소나가 시험지를 제작 중입니다...</p>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hidden mt-8">
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-6 no-print">
                <button onclick="switchTab('quiz')" id="tab-quiz-btn" class="flex-1 py-3 text-center font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer">📝 학생용 문제지</button>
                <button onclick="switchTab('answer')" id="tab-answer-btn" class="flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent cursor-pointer">🔑 교사용 정답지</button>
            </div>

            <!-- Tab Contents -->
            <div id="tab-quiz" class="print-area prose max-w-none bg-white p-6 rounded-xl border border-slate-100 shadow-sm whitespace-pre-wrap leading-relaxed"></div>
            <div id="tab-answer" class="print-area prose max-w-none bg-white p-6 rounded-xl border border-slate-100 shadow-sm whitespace-pre-wrap leading-relaxed hidden"></div>

            <!-- Print Guide -->
            <div class="mt-6 p-4 bg-orange-50 border border-orange-200 rounded-xl text-sm text-orange-800 flex items-center justify-between no-print">
                <span>🖨️ <strong>인쇄 방법:</strong> 키보드의 <strong>Ctrl + P</strong> (맥: Cmd + P)를 누르세요.</span>
                <button onclick="window.print()" class="bg-orange-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-orange-700 cursor-pointer">인쇄하기</button>
            </div>
        </div>
    </div>

    <script>
        let quizText = "";
        let answerText = "";

        function switchTab(type) {
            const quizBtn = document.getElementById('tab-quiz-btn');
            const answerBtn = document.getElementById('tab-answer-btn');
            const quizDiv = document.getElementById('tab-quiz');
            const answerDiv = document.getElementById('tab-answer');

            if (type === 'quiz') {
                quizBtn.className = "flex-1 py-3 text-center font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer";
                answerBtn.className = "flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent cursor-pointer";
                quizDiv.classList.remove('hidden');
                answerDiv.classList.add('hidden');
            } else {
                answerBtn.className = "flex-1 py-3 text-center font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer";
                quizBtn.className = "flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent cursor-pointer";
                answerDiv.classList.remove('hidden');
                quizDiv.classList.add('hidden');
            }
        }

        // 간단한 마크다운 스타일 정돈 함수 (외부 라이브러리 충돌 방지)
        function formatMarkdown(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // **굵게**
                .replace(/### (.*?)\n/g, '<h3 class="text-lg font-bold mt-4 mb-2 text-orange-600">$1</h3>')
                .replace(/## (.*?)\n/g, '<h2 class="text-xl font-bold mt-6 mb-3 text-orange-700">$1</h2>');
        }

        async function generateQuiz() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const grade = document.getElementById('grade').value.trim();
            const bookTitle = document.getElementById('bookTitle').value.trim();
            const authorName = document.getElementById('authorName').value.trim() || "입력 안 함";

            if (!apiKey) {
                alert("Google API Key를 입력해주세요!");
                return;
            }
            if (!bookTitle || !grade) {
                alert("학년과 책 제목을 모두 입력해주세요!");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result-section').classList.add('hidden');

            const systemPrompt = `
# 역할
당신은 20년 경력의 초·중등 국어 독서교육 전문가이자 교육부 권장도서 독서활동 평가문항 출제위원이다.
사용자는 [책 제목], [작가 이름], [학년]을 입력한다. 당신은 실제 책 내용을 기반으로 독서 이해 문제를 만든다.

# 가장 중요한 규칙
- 책 내용을 정확히 알고 있는 경우에만 문제를 출제한다.
- 내용을 정확히 확인할 수 없는 경우에는 절대로 추측하여 문제를 만들지 않는다.
- 대신 아래와 같이 답변한다:
  "이 책의 내용을 정확하게 확인할 수 없습니다.
  책 표지와 목차 또는 본문 일부를 업로드해 주시면 실제 내용을 기반으로 문제를 제작하겠습니다."

# 학년별 난이도 및 출제 초점
- 초1~2: 등장인물, 장소, 사건, 순서
- 초3~4: 중심 내용, 인물의 마음, 사건의 원인과 결과, 중요한 사실
- 초5~6: 주제, 교훈, 인물의 변화, 추론
- 중학생: 주제, 인물의 가치관, 갈등, 추론, 비판적 사고

# 문제 구성 (총 5문항)
1. 객관식 3문항
   - 형식: 항상 5지선다형 (1번~5번)
   - 유형 선택: 중심 내용, 내용 이해, 사건 순서, 원인과 결과, 인물의 성격, 인물의 마음, 추론, 주제, 교훈 중에서 중복 없이 선택
   - 객관식 규칙:
     * 정답은 반드시 하나여야 함
     * 오답도 그럴듯하게 출제할 것
     * "모두 맞다", "모두 아니다" 같은 선택지 사용 금지
     * 정답의 위치(1~5번)를 매번 다르게 랜덤 배치할 것
     * 지엽적인 세부 내용(단순 암기용 숫자, 연도 등)은 금지하고 핵심 내용 위주로 출제할 것

2. 서술형 2문항
   - 형식: 학생이 스스로 생각하고 논리적으로 서술하도록 출제
   - 예시 유형: "왜 그렇게 행동했는가?", "이 책이 말하려는 것은 무엇인가?", "내가 주인공이라면 어떻게 했을까?", "가장 인상 깊었던 장면과 이유는?"
   - 서술형 규칙:
     * 반드시 학생용 발문과 함께 교사/학부모를 위한 '모범 답안' 및 '채점 기준'을 함께 제공할 것

# 출력 양식
- 마크다운을 활용하여 가독성 좋고 깔끔하게 출력할 것
- 각 문제마다 정답과 상세한 해설을 포함할 것
- [문제지] 섹션의 맨 위에는 반드시 학생 작성란을 포함할 것:
  ---
  **[독서 활동 평가지]**
  - **학년/반**: [     ]학년 [     ]반  |  **번호**: [     ]번  |  **이름**: [           ]
  ---
- 반드시 결과물을 [문제지] 와 [정답지] 섹션으로 명확히 구분할 것.
`;

            const userPrompt = `대상 학년: ${grade}\n책 제목: ${bookTitle}\n작가 이름: ${authorName}\n\n[문제지]와 [정답지]를 명확히 구분하여 출제해주세요.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const fullResult = data.candidates[0].content.parts[0].text;

                if (fullResult.includes("[문제지]") && fullResult.includes("[정답지]")) {
                    const parts = fullResult.split("[정답지]");
                    quizText = parts[0].replace("[문제지]", "").trim();
                    answerText = parts[1].trim();
                } else {
                    quizText = fullResult;
                    answerText = "정답지를 분리하는 과정에서 형식이 일치하지 않았습니다.";
                }

                document.getElementById('tab-quiz').innerHTML = formatMarkdown(quizText);
                document.getElementById('tab-answer').innerHTML = formatMarkdown(answerText);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                alert(`오류가 발생했습니다: ${error.message}`);
            }
        }
    </script>
</body>
</html>
