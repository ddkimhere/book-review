<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책의 온도 - 읽은 만큼 성장합니다.</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            header, footer, button, input, .no-print { display: none !important; }
            body { background-color: white !important; color: black !important; font-size: 11pt !important; }
            .print-area { display: block !important; visibility: visible !important; box-shadow: none !important; border: none !important; padding: 0 !important; }
        }
        .exam-layout { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; line-height: 1.8; color: #111; white-space: pre-wrap; }
        .question-box { margin-top: 40px; margin-bottom: 20px; page-break-inside: avoid; }
        .option-item { display: block; margin-top: 8px; margin-left: 25px; font-size: 10.5pt; }
    </style>
</head>
<body class="bg-slate-100 text-slate-950 min-h-screen flex flex-col items-center p-4 sm:p-6">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-6 sm:p-10 my-4">
        <div class="text-center mb-8 no-print">
            <h1 class="text-2xl sm:text-4xl font-black text-orange-600 mb-2">🔥 책의 온도</h1>
            <p class="text-sm font-medium text-slate-500">초·중등 독서교육 전문가 맞춤형 독서 평가 프로그램</p>
        </div>

        <div id="form-section" class="space-y-4 bg-slate-50 p-6 rounded-2xl border border-slate-200 no-print mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">학년</label>
                    <input type="text" id="grade" value="중학교 2학년" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl bg-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">책 제목</label>
                    <input type="text" id="bookTitle" placeholder="예: 동물농장" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl bg-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">작가 이름</label>
                    <input type="text" id="authorName" placeholder="예: 조지 오웰" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl bg-white text-sm">
                </div>
            </div>
            <button onclick="generateQuiz()" id="submitBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3.5 rounded-xl transition shadow-md cursor-pointer">✨ 전문가 시험지 자동 출제하기</button>
        </div>

        <div id="loading" class="hidden text-center py-16 no-print">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent"></div>
            <p class="mt-4 text-slate-600 font-bold text-lg">전문가 페르소나가 시험지를 제작 중입니다...</p>
        </div>

        <div id="result-section" class="hidden">
            <div class="flex border-b border-slate-200 mb-6 no-print">
                <button onclick="switchTab('quiz')" id="tab-quiz-btn" class="flex-1 py-3 font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer">📝 학생용 문제지</button>
                <button onclick="switchTab('answer')" id="tab-answer-btn" class="flex-1 py-3 font-bold text-slate-400 border-b-2 border-transparent cursor-pointer">🔑 교사용 정답지</button>
            </div>
            <div id="tab-quiz" class="print-area exam-layout bg-white p-6 rounded-2xl border shadow-sm"></div>
            <div id="tab-answer" class="print-area exam-layout bg-white p-6 rounded-2xl border shadow-sm hidden"></div>

            <div class="mt-8 p-5 bg-orange-50 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 no-print">
                <p class="text-sm font-medium text-orange-900">🖨️ 하단 버튼을 눌러 인쇄하세요.</p>
                <div class="flex gap-3">
                    <button onclick="printOnlyQuiz()" class="bg-slate-800 text-white px-5 py-2 rounded-xl text-xs font-bold cursor-pointer">📄 학생용 인쇄</button>
                    <button onclick="printOnlyAnswer()" class="bg-orange-600 text-white px-5 py-2 rounded-xl text-xs font-bold cursor-pointer">🔑 교사용 인쇄</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FIXED_API_KEY = "AQ.Ab8RN6IIifBfy5NyxOxhyXXCFk2pi9fY7nqljNu03sB2pqVVHg";
        let quizText = "", answerText = "", currentBookTitle = "", currentGrade = "", currentAuthor = "";

        function switchTab(type) {
            const quizBtn = document.getElementById('tab-quiz-btn');
            const answerBtn = document.getElementById('tab-answer-btn');
            const quizDiv = document.getElementById('tab-quiz');
            const answerDiv = document.getElementById('tab-answer');

            if (type === 'quiz') {
                quizBtn.className = "flex-1 py-3 font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer";
                answerBtn.className = "flex-1 py-3 font-bold text-slate-400 border-b-2 border-transparent cursor-pointer";
                quizDiv.classList.remove('hidden');
                answerDiv.classList.add('hidden');
            } else {
                answerBtn.className = "flex-1 py-3 font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer";
                quizBtn.className = "flex-1 py-3 font-bold text-slate-400 border-b-2 border-transparent cursor-pointer";
                answerDiv.classList.remove('hidden');
                quizDiv.classList.add('hidden');
            }
        }

        function formatExamText(text) {
            let cleaned = text.replace(/---/g, '').replace(/\[문제지\]/g, '').replace(/\[정답지\]/g, '').trim();
            cleaned = cleaned.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold">$1</strong>');
            cleaned = cleaned.replace(/(\n\s*[1-5]\.\s+|\n\s*\[?[0-9]+번\]?)/g, '<br><br><div class="question-box"><strong style="font-size:1.1rem;">$1</strong>');
            cleaned = cleaned.replace(/([가-마]\.\s*|[①②③④⑤]\s*)/g, '<br><span class="option-item">$1</span>');
            return cleaned;
        }

        function printPage(title, content) {
            const w = window.open('', '_blank');
            w.document.write(`<html><head><title>${title}</title><style>body{font-family:Malgun Gothic; padding:40px; line-height:1.8;} .exam-header{border-bottom:3px solid #000; padding-bottom:20px; margin-bottom:30px;} .exam-info{display:flex; justify-content:space-between; margin-top:15px; font-weight:bold; background:#f9f9f9; padding:10px;} .question-box{margin-top:30px; margin-bottom:30px;} .option-item{display:block; margin-top:8px; margin-left:25px;}</style></head><body>
                <div class="exam-header"><h1>${title} (${currentBookTitle})</h1><div class="exam-info"><div>학년: ${currentGrade}</div><div>이름: ___________</div></div></div>${content}<script>window.onload=()=>window.print()<\/script></body></html>`);
            w.document.close();
        }

        async function generateQuiz() {
            const grade = document.getElementById('grade').value.trim();
            const bookTitle = document.getElementById('bookTitle').value.trim();
            const authorName = document.getElementById('authorName').value.trim();

            if (!bookTitle || !grade) {
                alert("학년과 책 제목을 모두 입력해주세요.");
                return;
            }

            currentBookTitle = bookTitle; 
            currentGrade = grade; 
            currentAuthor = authorName;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result-section').classList.add('hidden');

            const systemPrompt = `# 역할
당신은 20년 경력의 초·중등 국어 독서교육 전문가이자 교육부 권장도서 독서활동 평가문항 출제위원이다.
사용자는 [책 제목], [작가 이름], [학년]을 입력한다. 당신은 실제 책 내용을 기반으로 독서 이해 문제를 만든다.

# 가장 중요한 규칙
- 책 내용을 정확히 알고 있는 경우에만 문제를 출제한다.
- 내용을 정확히 확인할 수 없는 경우에는 절대로 추측하여 문제를 만들지 않는다.
- 대신 아래와 같이 답변한다:
"이 책의 내용을 정확하게 확인할 수 없습니다.
책 표지와 목차 또는 본문 일부를 업로드해 주시면 실제 내용을 기반으로 문제를 제작하겠습니다."

# 학년별 난이도 및 출제 초점
- 초1~2: 등장인물, 장소, 사건, 순서
- 초3~4: 중심 내용, 인물의 마음, 사건의 원인과 결과, 중요한 사실
- 초5~6: 주제, 교훈, 인물의 변화, 추론
- 중학생: 주제, 인물의 가치관, 갈등, 추론, 비판적 사고

# 문제 구성 (총 5문항)
1. 객관식 3문항
- 형식: 항상 5지선다형 (1번~5번)
- 유형 선택: 중심 내용, 내용 이해, 사건 순서, 원인과 결과, 인물의 성격, 인물의 마음, 추론, 주제, 교훈 중에서 중복 없이 선택
- 객관식 규칙:
* 정답은 반드시 하나여야 함
* 오답도 그럴듯하게 출제할 것
* "모두 맞다", "모두 아니다" 같은 선택지 사용 금지
* 정답의 위치(1~5번)를 매번 다르게 랜덤 배치할 것
* 지엽적인 세부 내용(단순 암기용 숫자, 연도 등)은 금지하고 핵심 내용 위주로 출제할 것

2. 서술형 2문항
- 형식: 학생이 스스로 생각하고 논리적으로 서술하도록 출제
- 예시 유형: "왜 그렇게 행동했는가?", "이 책이 말하려는 것은 무엇인가?", "내가 주인공이라면 어떻게 했을까?", "가장 인상 깊었던 장면과 이유는?"
- 서술형 규칙:
* 반드시 학생용 발문과 함께 교사/학부모를 위한 '모범 답안' 및 '채점 기준'을 함께 제공할 것

# 출력 양식
- 마크다운을 활용하여 가독성 좋고 깔끔하게 출력할 것
- 각 문제마다 정답과 상세한 해설을 포함할 것
- [문제지] 섹션의 맨 위에는 반드시 학생 작성란을 포함할 것:
---
**[독서 활동 평가지]**
- **학년/반**: [ ]학년 [ ]반 | **번호**: [ ]번 | **이름**: [ ]
---
- 반드시 결과물을 [문제지] 와 [정답지] 섹션으로 명확히 구분할 것.`;

            const userPrompt = `학년: ${grade}\n책 제목: ${bookTitle}\n작가 이름: ${authorName || "정보 없음"}\n\n[문제지]와 [정답지]를 명확히 구분하여 출제해주세요.`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${FIXED_API_KEY}`, {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{role: "user", parts: [{text: systemPrompt + "\n\n" + userPrompt}]}]})
                });
                
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                
                const text = data.candidates[0].content.parts[0].text;

                if (text.includes("[문제지]") && text.includes("[정답지]")) {
                    const parts = text.split("[정답지]");
                    quizText = parts[0].replace("[문제지]", "").trim();
                    answerText = parts[1].trim();
                } else {
                    quizText = text;
                    answerText = "정답지 형식이 일치하지 않습니다.";
                }

                document.getElementById('tab-quiz').innerHTML = formatExamText(quizText);
                document.getElementById('tab-answer').innerHTML = formatExamText(answerText);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');
            } catch(e) {
                document.getElementById('loading').classList.add('hidden');
                alert("오류가 발생했습니다: " + e.message);
            }
        }

        function printOnlyQuiz() { printPage("학생용 문제지", document.getElementById('tab-quiz').innerHTML); }
        function printOnlyAnswer() { printPage("교사용 정답지", document.getElementById('tab-answer').innerHTML); }
    </script>
</body>
</html>
