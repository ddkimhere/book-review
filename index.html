<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책의 온도 - 읽은 만큼 성장합니다.</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            header, footer, button, input, .no-print {
                display: none !important;
            }
            body {
                background-color: white !important;
                color: black !important;
                font-size: 11pt !important;
            }
            .print-area {
                display: block !important;
                visibility: visible !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col items-center p-4 sm:p-6">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-6 sm:p-10 my-4">
        <!-- Header (Gemini 버전 문구 제거 완료) -->
        <div class="text-center mb-8 no-print">
            <h1 class="text-2xl sm:text-4xl font-black text-orange-600 mb-2">🔥 책의 온도</h1>
            <p class="text-sm font-medium text-slate-500">초·중등 독서교육 전문가 맞춤형 독서 평가 프로그램</p>
        </div>

        <!-- Input Form -->
        <div id="form-section" class="space-y-4 bg-slate-50 p-6 rounded-2xl border border-slate-200 no-print mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">학년</label>
                    <input type="text" id="grade" value="중학교 2학년" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none bg-white text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">책 제목</label>
                    <input type="text" id="bookTitle" placeholder="예: 소년이 온다" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none bg-white text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">작가 이름</label>
                    <input type="text" id="authorName" placeholder="예: 한강" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none bg-white text-sm font-medium">
                </div>
            </div>
            <button onclick="generateQuiz()" id="submitBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-md cursor-pointer text-base">
                ✨ 전문가 시험지 자동 출제하기
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-16 no-print">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent"></div>
            <p class="mt-4 text-slate-600 font-bold text-lg">독서 교육 전문가가 고품질 문항을 출제 중입니다...</p>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hidden">
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-6 no-print">
                <button onclick="switchTab('quiz')" id="tab-quiz-btn" class="flex-1 py-3 text-center font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer text-base">📝 학생용 문제지</button>
                <button onclick="switchTab('answer')" id="tab-answer-btn" class="flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent cursor-pointer text-base">🔑 교사용 정답 및 해설지</button>
            </div>

            <!-- Tab Contents -->
            <div id="tab-quiz" class="print-area bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm leading-relaxed text-slate-800"></div>
            <div id="tab-answer" class="print-area bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm leading-relaxed text-slate-800 hidden"></div>

            <!-- Print Buttons -->
            <div class="mt-8 p-5 bg-orange-50 border border-orange-200 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 no-print">
                <div class="text-sm text-orange-900 font-medium">
                    🖨️ <strong>인쇄 안내:</strong> 아래 버튼을 누르면 시험지 양식에 맞춰 깔끔하게 출력됩니다.
                </div>
                <div class="flex gap-3 w-full sm:w-auto">
                    <button onclick="printOnlyQuiz()" class="flex-1 sm:flex-none bg-slate-800 text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-900 cursor-pointer shadow-sm">
                        📄 학생용 문제지 인쇄
                    </button>
                    <button onclick="printOnlyAnswer()" class="flex-1 sm:flex-none bg-orange-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-orange-700 cursor-pointer shadow-sm">
                        🔑 교사용 답안지 인쇄
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let quizText = "";
        let answerText = "";
        let currentBookTitle = "";
        let currentGrade = "";

        const FIXED_API_KEY = "AQ.Ab8RN6IIifBfy5NyxOxhyXXCFk2pi9fY7nqljNu03sB2pqVVHg";

        function switchTab(type) {
            const quizBtn = document.getElementById('tab-quiz-btn');
            const answerBtn = document.getElementById('tab-answer-btn');
            const quizDiv = document.getElementById('tab-quiz');
            const answerDiv = document.getElementById('tab-answer');

            if (type === 'quiz') {
                quizBtn.className = "flex-1 py-3 text-center font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer text-base";
                answerBtn.className = "flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent cursor-pointer text-base";
                quizDiv.classList.remove('hidden');
                answerDiv.classList.add('hidden');
            } else {
                answerBtn.className = "flex-1 py-3 text-center font-bold text-orange-600 border-b-2 border-orange-600 cursor-pointer text-base";
                quizBtn.className = "flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent cursor-pointer text-base";
                answerDiv.classList.remove('hidden');
                quizDiv.classList.add('hidden');
            }
        }

        function formatMarkdown(text) {
            if (!text) return "";
            // 불필요한 메타마크다운 기호 제거 후 깔끔한 HTML 태그로 변환
            let cleaned = text
                .replace(/---/g, '')
                .replace(/\[독서 활동 평가지\]/g, '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            return cleaned
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>')
                .replace(/### (.*?)\n/g, '<h3 class="text-base font-bold mt-6 mb-3 text-orange-700 bg-orange-50 p-2 rounded-lg border-l-4 border-orange-600">$1</h3>')
                .replace(/## (.*?)\n/g, '<h2 class="text-lg font-black mt-8 mb-4 text-slate-900 border-b pb-2">$1</h2>');
        }

        // 학생용 시험지 인쇄 창 생성
        function printOnlyQuiz() {
            const quizContent = document.getElementById('tab-quiz').innerHTML;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="ko">
                <head>
                    <meta charset="UTF-8">
                    <title>[책의 온도] 학생용 문제지 - ${currentBookTitle}</title>
                    <style>
                        body { font-family: 'Malgun Gothic', sans-serif; padding: 40px; line-height: 1.7; color: #111; max-width: 800px; margin: 0 auto; }
                        .exam-header { border-bottom: 3px solid #111; padding-bottom: 20px; margin-bottom: 30px; }
                        .exam-title { font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 15px; color: #c2410c; }
                        .exam-info { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; background: #f9f9f9; padding: 12px 20px; border-radius: 8px; border: 1px solid #ddd; }
                        .question-block { margin-bottom: 25px; }
                        strong { font-weight: bold; }
                        @media print { body { padding: 0; } }
                    </style>
                </head>
                <body>
                    <div class="exam-header">
                        <div class="exam-title">🔥 책의 온도 독서 평가지 (${currentBookTitle})</div>
                        <div class="exam-info">
                            <div>학년: ${currentGrade}</div>
                            <div>날짜: 2026년 _____월 _____일</div>
                            <div>이름: ____________________</div>
                        </div>
                    </div>
                    <div class="exam-body">
                        ${quizContent}
                    </div>
                    <script>
                        window.onload = function() { window.print(); window.close(); }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        // 교사용 정답지 인쇄 창 생성
        function printOnlyAnswer() {
            const answerContent = document.getElementById('tab-answer').innerHTML;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="ko">
                <head>
                    <meta charset="UTF-8">
                    <title>[책의 온도] 교사용 정답지 - ${currentBookTitle}</title>
                    <style>
                        body { font-family: 'Malgun Gothic', sans-serif; padding: 40px; line-height: 1.7; color: #111; max-width: 800px; margin: 0 auto; }
                        .exam-header { border-bottom: 3px solid #c2410c; padding-bottom: 15px; margin-bottom: 30px; font-size: 22px; font-weight: 900; color: #c2410c; text-align: center; }
                        strong { font-weight: bold; }
                        @media print { body { padding: 0; } }
                    </style>
                </head>
                <body>
                    <div class="exam-header">🔑 책의 온도 교사용 정답 및 해설 (${currentBookTitle})</div>
                    <div class="exam-body">
                        ${answerContent}
                    </div>
                    <script>
                        window.onload = function() { window.print(); window.close(); }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        async function generateQuiz() {
            const grade = document.getElementById('grade').value.trim();
            const bookTitle = document.getElementById('bookTitle').value.trim();
            const authorName = document.getElementById('authorName').value.trim() || "입력 안 함";

            if (!bookTitle || !grade) {
                alert("학년과 책 제목을 모두 입력해주세요!");
                return;
            }

            currentBookTitle = bookTitle;
            currentGrade = grade;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result-section').classList.add('hidden');

            const systemPrompt = `
# 역할
당신은 20년 경력의 초·중등 국어 독서교육 전문가이자 교육부 권장도서 독서활동 평가문항 출제위원이다.
사용자는 [책 제목], [작가 이름], [학년]을 입력한다. 당신은 실제 책 내용을 기반으로 독서 이해 문제를 만든다.

# 가장 중요한 규칙
- 책 내용을 정확히 알고 있는 경우에만 문제를 출제한다.
- 내용을 정확히 확인할 수 없는 경우에는 절대로 추측하여 문제를 만들지 않는다.
- 대신 아래와 같이 답변한다:
  "이 책의 내용을 정확하게 확인할 수 없습니다.
  책 표지와 목차 또는 본문 일부를 업로드해 주시면 실제 내용을 기반으로 문제를 제작하겠습니다."

# 학년별 난이도 및 출제 초점
- 초1~2: 등장인물, 장소, 사건, 순서
- 초3~4: 중심 내용, 인물의 마음, 사건의 원인과 결과, 중요한 사실
- 초5~6: 주제, 교훈, 인물의 변화, 추론
- 중학생: 주제, 인물의 가치관, 갈등, 추론, 비판적 사고

# 문제 구성 (총 5문항)
1. 객관식 3문항
   - 형식: 항상 5지선다형 (1번~5번)
   - 유형 선택: 중심 내용, 내용 이해, 사건 순서, 원인과 결과, 인물의 성격, 인물의 마음, 추론, 주제, 교훈 중에서 중복 없이 선택
   - 객관식 규칙:
     * 정답은 반드시 하나여야 함
     * 오답도 그럴듯하게 출제할 것
     * "모두 맞다", "모두 아니다" 같은 선택지 사용 금지
     * 정답의 위치(1~5번)를 매번 다르게 랜덤 배치할 것
     * 지엽적인 세부 내용(단순 암기용 숫자, 연도 등)은 금지하고 핵심 내용 위주로 출제할 것

2. 서술형 2문항
   - 형식: 학생이 스스로 생각하고 논리적으로 서술하도록 출제
   - 예시 유형: "왜 그렇게 행동했는가?", "이 책이 말하려는 것은 무엇인가?", "내가 주인공이라면 어떻게 했을까?", "가장 인상 깊었던 장면과 이유는?"
   - 서술형 규칙:
     * 반드시 학생용 발문과 함께 교사/학부모를 위한 '모범 답안' 및 '채점 기준'을 함께 제공할 것

# 출력 양식
- 마크다운을 활용하여 가독성 좋고 깔끔하게 출력할 것
- 각 문제마다 정답과 상세한 해설을 포함할 것
- 반드시 결과물을 [문제지] 와 [정답지] 섹션으로 명확히 구분할 것.
`;

            const userPrompt = `대상 학년: ${grade}\n책 제목: ${bookTitle}\n작가 이름: ${authorName}\n\n[문제지]와 [정답지]를 명확히 구분하여 출제해주세요.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${FIXED_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const fullResult = data.candidates[0].content.parts[0].text;

                if (fullResult.includes("[문제지]") && fullResult.includes("[정답지]")) {
                    const parts = fullResult.split("[정답지]");
                    quizText = parts[0].replace("[문제지]", "").trim();
                    answerText = parts[1].trim();
                } else {
                    quizText = fullResult;
                    answerText = "정답지를 분리하는 과정에서 형식이 일치하지 않았습니다.";
                }

                document.getElementById('tab-quiz').innerHTML = formatMarkdown(quizText);
                document.getElementById('tab-answer').innerHTML = formatMarkdown(answerText);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                alert(`오류가 발생했습니다: ${error.message}`);
            }
        }
    </script>
</body>
</html>
