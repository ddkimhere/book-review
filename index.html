<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>책의 온도 · 독서 평가 생성기</title>
<style>
:root{
  --ink:#20242a; --muted:#6b7280; --line:#d8dde5; --accent:#c65a2e;
  --soft:#f6f7f9; --paper:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
button,input{font:inherit}
.app{max-width:1180px;margin:0 auto;padding:28px}
.panel{background:#fff;border:1px solid #e1e5ea;border-radius:18px;box-shadow:0 10px 30px rgba(30,40,50,.07);padding:24px}
h1{margin:0;font-size:28px}
.sub{color:var(--muted);margin:7px 0 0}
.form-grid{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:14px;margin-top:22px}
label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#555}
input{width:100%;padding:12px 13px;border:1px solid #cfd5dc;border-radius:10px;background:#fff}
.primary{margin-top:16px;width:100%;padding:14px;border:0;border-radius:11px;background:#222;color:#fff;font-weight:800;cursor:pointer}
.secondary{padding:11px 15px;border:1px solid #cfd5dc;border-radius:10px;background:#fff;font-weight:700;cursor:pointer}
.status{margin-top:16px;padding:12px;border-radius:10px;background:#f7efe9;color:#8c431f;display:none}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;gap:10px}
.toolbar .actions{display:flex;gap:8px}
#preview{display:none}

/* ===== A4 exam paper ===== */
.paper{
  width:210mm; min-height:297mm; margin:0 auto 20px; padding:14mm 15mm 16mm;
  background:var(--paper); color:#111; box-shadow:0 8px 28px rgba(0,0,0,.12);
  position:relative;
}
.paper + .paper{page-break-before:always}
.exam-top{border-top:3px solid #202020;border-bottom:1px solid #777;padding:8mm 0 5mm;margin-bottom:6mm}
.brand{font-size:10pt;letter-spacing:.08em;font-weight:800;color:#777}
.exam-title{font-size:23pt;font-weight:900;letter-spacing:-.04em;margin:2mm 0 1mm}
.book-line{font-size:10.5pt;color:#555}
.info-table{width:100%;border-collapse:collapse;margin-top:5mm}
.info-table td{border:1px solid #aeb4bc;padding:3.2mm 4mm;font-size:10pt}
.info-table td:first-child{font-weight:800;background:#f7f7f7;width:20%}
.section-title{margin:7mm 0 4mm;padding:2.5mm 3mm;border-left:5px solid #222;background:#f2f3f5;font-size:12pt;font-weight:900}
.q{margin:0 0 7mm;break-inside:avoid;page-break-inside:avoid}
.q-head{display:flex;gap:6px;align-items:flex-start;font-size:11pt;font-weight:800;line-height:1.65}
.q-num{flex:0 0 auto}
.q-body{flex:1}
.options{margin:2.5mm 0 0 7mm}
.opt{display:flex;gap:7mm;align-items:flex-start;margin:1.5mm 0;line-height:1.55;font-size:10.5pt}
.opt-label{flex:0 0 6mm}
.opt-text{flex:1}
.answer-circle{display:inline-block;width:4.5mm;height:4.5mm;border:1px solid #999;border-radius:50%;vertical-align:-.8mm;margin-right:1mm}
.short-box{margin:3mm 0 0 7mm;border:1px solid #aaa;min-height:42mm;padding:3mm}
.line{height:8mm;border-bottom:1px solid #c7c7c7}
.score-box{float:right;border:1px solid #555;padding:1.5mm 4mm;font-size:9pt;font-weight:800}
.footer{position:absolute;bottom:7mm;left:15mm;right:15mm;border-top:1px solid #ddd;padding-top:2mm;font-size:8pt;color:#888;display:flex;justify-content:space-between}
.instruction{font-size:9pt;color:#666;margin:0 0 4mm}
.answer-page .q{margin-bottom:6mm}
.answer{margin:2mm 0 0 7mm;background:#f7f7f7;border-left:3px solid #555;padding:3mm 4mm;font-size:9.5pt;line-height:1.6}
.rubric{margin:2mm 0 0 7mm;font-size:9pt;color:#444;line-height:1.55}
.rubric strong{color:#111}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .no-print,.app>.panel,.toolbar{display:none!important}
  #preview{display:block!important}
  .paper{margin:0;box-shadow:none}
}
@media(max-width:800px){
 .app{padding:12px}.form-grid{grid-template-columns:1fr}
 .paper{width:100%;min-height:auto;padding:25px}
}
</style>
</head>
<body>
<div class="app">
  <div class="panel no-print">
    <h1>책의 온도 · 독서 평가 생성기</h1>
    <p class="sub">학생에게 바로 배부할 수 있는 A4 시험지 형태로 생성합니다.</p>
    <div class="form-grid">
      <div><label>학년</label><input id="grade" value="중학교 1학년"></div>
      <div><label>책 제목</label><input id="bookTitle" placeholder="예: 불안 쫌 아는 10대"></div>
      <div><label>작가</label><input id="author" placeholder="예: 이재환"></div>
    </div>
    <button class="primary" onclick="generateExam()">독서 평가 시험지 만들기</button>
    <div id="status" class="status"></div>
  </div>

  <div id="preview"></div>
</div>

<script>
let exam = null;
const FIXED_API_KEY = "AQ.Ab8RN6IIifBfy5NyxOxhyXXCFk2pi9fY7nqljNu03sB2pqVVHg";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function lines(n=4){return Array.from({length:n},()=>'<div class="line"></div>').join("")}

function renderHeader(data){
  return `
    <div class="exam-top">
      <div class="brand">YMS · 책의 온도</div>
      <div class="exam-title">독서 평가</div>
      <div class="book-line"><strong>${esc(data.bookTitle)}</strong> · ${esc(data.author || "작가 정보 없음")}</div>
      <table class="info-table">
        <tr><td>학년</td><td>${esc(data.grade)}</td><td>이름</td><td style="width:28%"></td></tr>
        <tr><td>실시일</td><td>20____년 ____월 ____일</td><td>점수</td><td></td></tr>
      </table>
    </div>`;
}

function renderStudent(data){
  const mc=data.questions.filter(q=>q.type==="multiple_choice");
  const sa=data.questions.filter(q=>q.type==="short_answer");
  return `<div class="paper">
    ${renderHeader(data)}
    <div style="border:1px solid #aeb4bc;padding:3mm 4mm;margin-bottom:5mm;font-size:9.5pt;background:#fafafa">
      <strong>[독서 활동 평가지]</strong><br>
      - <strong>학년/반</strong>: [ &nbsp; &nbsp; &nbsp; ]학년 [ &nbsp; &nbsp; &nbsp; ]반 &nbsp; | &nbsp; <strong>번호</strong>: [ &nbsp; &nbsp; &nbsp; ]번 &nbsp; | &nbsp; <strong>이름</strong>: [ &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ]
    </div>
    <div class="section-title">Ⅰ. 객관식 · ${mc.length}문항</div>
    <p class="instruction">※ 각 문항의 가장 알맞은 답을 하나 고르시오.</p>
    ${mc.map((q,i)=>`
      <div class="q">
        <div class="q-head"><span class="q-num">${i+1}.</span><span class="q-body">${esc(q.question)}</span></div>
        <div class="options">
          ${(q.options||[]).map((o,j)=>`<div class="opt"><span class="opt-label"><span class="answer-circle"></span>${["①","②","③","④","⑤"][j]}</span><span class="opt-text">${esc(o)}</span></div>`).join("")}
        </div>
      </div>`).join("")}
    <div class="section-title">Ⅱ. 서술형 · ${sa.length}문항</div>
    <p class="instruction">※ 책의 내용을 바탕으로 자신의 생각을 논리적으로 서술하시오.</p>
    ${sa.map((q,i)=>`
      <div class="q">
        <div class="q-head"><span class="q-num">${mc.length+i+1}.</span><span class="q-body">${esc(q.question)}</span></div>
        <div class="short-box">${lines(q.answerLines || 5)}</div>
      </div>`).join("")}
    <div class="footer"><span>책의 온도 · 독서 평가</span><span>학생용 문제지</span></div>
  </div>`;
}

function renderAnswer(data){
  return `<div class="paper answer-page">
    ${renderHeader(data)}
    <div class="section-title">교사용 정답 및 해설지</div>
    <p class="instruction">학생용 문제지와 동일한 문항 번호를 사용합니다.</p>
    ${data.questions.map((q,i)=>{
      const num=i+1;
      if(q.type==="multiple_choice"){
        return `<div class="q">
          <div class="q-head"><span class="q-num">${num}.</span><span class="q-body">${esc(q.question)}</span></div>
          <div class="answer"><strong>정답: ${esc(q.answer)}</strong><br>${esc(q.explanation)}</div>
        </div>`;
      }
      return `<div class="q">
        <div class="q-head"><span class="q-num">${num}.</span><span class="q-body">${esc(q.question)}</span></div>
        <div class="answer"><strong>모범 답안</strong><br>${esc(q.modelAnswer)}</div>
        <div class="rubric"><strong>채점 기준</strong><br>${esc(q.rubric)}</div>
      </div>`;
    }).join("")}
    <div class="footer"><span>책의 온도 · 독서 평가</span><span>교사용 정답 및 해설</span></div>
  </div>`;
}

async function generateExam(){
  const grade=document.getElementById("grade").value.trim();
  const bookTitle=document.getElementById("bookTitle").value.trim();
  const author=document.getElementById("author").value.trim();
  const status=document.getElementById("status");
  if(!grade||!bookTitle){alert("학년과 책 제목을 모두 입력해주세요.");return}
  status.style.display="block";status.textContent="책 내용을 확인하고 문항을 구성하는 중입니다…";

  const prompt=`# 역할
당신은 20년 경력의 초·중등 국어 독서교육 전문가이자 교육부 권장도서 독서활동 평가문항 출제위원이다.
사용자는 [책 제목], [작가 이름], [학년]을 입력한다. 당신은 실제 책 내용을 기반으로 독서 이해 문제를 만든다.

# 가장 중요한 규칙
- 책 내용을 정확히 알고 있는 경우에만 문제를 출제한다.
- 내용을 정확히 확인할 수 없는 경우에는 절대로 추측하여 문제를 만들지 않는다.
- 대신 아래와 같이 답변한다:
"이 책의 내용을 정확하게 확인할 수 없습니다.
책 표지와 목차 또는 본문 일부를 업로드해 주시면 실제 내용을 기반으로 문제를 제작하겠습니다."

# 학년별 난이도 및 출제 초점
- 초1~2: 등장인물, 장소, 사건, 순서
- 초3~4: 중심 내용, 인물의 마음, 사건의 원인과 결과, 중요한 사실
- 초5~6: 주제, 교훈, 인물의 변화, 추론
- 중학생: 주제, 인물의 가치관, 갈등, 추론, 비판적 사고

# 문제 구성 (총 5문항)
1. 객관식 3문항
- 형식: 항상 5지선다형 (1번~5번)
- 유형 선택: 중심 내용, 내용 이해, 사건 순서, 원인과 결과, 인물의 성격, 인물의 마음, 추론, 주제, 교훈 중에서 중복 없이 선택
- 객관식 규칙:
* 정답은 반드시 하나여야 함
* 오답도 그럴듯하게 출제할 것
* "모두 맞다", "모두 아니다" 같은 선택지 사용 금지
* 정답의 위치(1번~5번)를 매번 다르게 랜덤 배치할 것
* 지엽적인 세부 내용(단순 암기용 숫자, 연도 등)은 금지하고 핵심 내용 위주로 출제할 것

2. 서술형 2문항
- 형식: 학생이 스스로 생각하고 논리적으로 서술하도록 출제
- 예시 유형: "왜 그렇게 행동했는가?", "이 책이 말하려는 것은 무엇인가?", "내가 주인공이라면 어떻게 했을까?", "가장 인상 깊었던 장면과 이유는?"
- 서술형 규칙:
* 반드시 학생용 발문과 함께 교사/학부모를 위한 '모범 답안' 및 '채점 기준'을 함께 제공할 것

# 출력 양식
- 마크다운을 활용하여 가독성 좋고 깔끔하게 출력할 것
- 각 문제마다 정답과 상세한 해설을 포함할 것
- [문제지] 섹션의 맨 위에는 반드시 학생 작성란을 포함할 것:
---
**[독서 활동 평가지]**
- **학년/반**: [ ]학년 [ ]반 | **번호**: [ ]번 | **이름**: [ ]
---
- 반드시 결과물을 [문제지] 와 [정답지] 섹션으로 명확히 구분할 것.

입력 데이터:
학년: ${grade}
책 제목: ${bookTitle}
작가: ${author||"정보 없음"}

만약 책 내용을 정확히 확인할 수 없는 경우, 반드시 다음 JSON 구조 중 verified를 false로 하고 message에 안내 문구를 담아 출력하라.
확인 가능한 경우 아래 JSON 구조로만 출력하라. (마크다운 코드블록이나 다른 설명 문구는 일체 출력하지 말 것)

JSON 구조:
{
 "verified": true,
 "bookTitle": "${bookTitle}",
 "author": "${author}",
 "grade": "${grade}",
 "questions": [
   {"type":"multiple_choice","question":"...","options":["...","...","...","...","..."],"answer":"①","explanation":"..."},
   {"type":"multiple_choice","question":"...","options":["...","...","...","...","..."],"answer":"②","explanation":"..."},
   {"type":"multiple_choice","question":"...","options":["...","...","...","...","..."],"answer":"③","explanation":"..."},
   {"type":"short_answer","question":"...","modelAnswer":"...","rubric":"...","answerLines":6},
   {"type":"short_answer","question":"...","modelAnswer":"...","rubric":"...","answerLines":6}
 ]
}
책 내용을 정확히 확인할 수 없다면:
{"verified":false,"bookTitle":"${bookTitle}","author":"${author}","grade":"${grade}","message":"이 책의 내용을 정확하게 확인할 수 없습니다.\n책 표지와 목차 또는 본문 일부를 업로드해 주시면 실제 내용을 기반으로 문제를 제작하겠습니다.","questions":[]}`;

  try{
    const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key="+encodeURIComponent(FIXED_API_KEY),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],
        generationConfig:{responseMimeType:"application/json"}})
    });
    const data=await res.json();
    if(data.error) throw new Error(data.error.message||"API 오류");
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) throw new Error("생성 결과가 없습니다.");
    exam=JSON.parse(text);
    if(!exam.verified) throw new Error(exam.message||"책 내용을 확인할 수 없습니다.");
    if(!Array.isArray(exam.questions)||exam.questions.length!==5) throw new Error("문항 구성 오류: 3+2 문항이 아닙니다.");
    if(exam.questions.slice(0,3).some(q=>q.type!=="multiple_choice"||q.options?.length!==5)) throw new Error("객관식 문항 형식 오류입니다.");
    if(exam.questions.slice(3).some(q=>q.type!=="short_answer")) throw new Error("서술형 문항 형식 오류입니다.");

    document.getElementById("preview").innerHTML=renderStudent(exam)+renderAnswer(exam);
    status.style.display="none";
    window.scrollTo({top:document.getElementById("preview").offsetTop-20,behavior:"smooth"});
  }catch(e){
    status.textContent="생성 실패: "+e.message;
  }
}
</script>
</body>
</html>
